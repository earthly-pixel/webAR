<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebAR MindAR + A-Frame Demo</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #000;
        touch-action: none;
      }

      .ar-overlay-button {
        position: absolute;
        left: 50%;
        bottom: 32px;
        transform: translateX(-50%);
        z-index: 5;
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 999px;
        padding: 12px 20px;
        background: rgba(255, 215, 0, 0.4);
        color: #111;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        white-space: nowrap;
        opacity: 1;
        visibility: visible;
        pointer-events: none;
        transition: opacity 0.25s ease, visibility 0.25s ease;
      }

      .ar-overlay-button.is-hidden {
        opacity: 0;
        visibility: hidden;
      }

      .mindar-ui-overlay.mindar-ui-scanning {
        z-index: 2147483646 !important;
      }

      .mindar-ui-scanning .scanning {
        position: relative;
        filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.4));
      }

      .mindar-ui-scanning .scanning .inner {
        opacity: 1 !important;
        border-radius: 0;
        background: linear-gradient(to right, rgba(255, 215, 0, 0.4) 10px, transparent 10px)
            0 0,
          linear-gradient(to right, rgba(255, 215, 0, 0.4) 10px, transparent 10px)
            0 100%,
          linear-gradient(to left, rgba(255, 215, 0, 0.4) 10px, transparent 10px)
            100% 0,
          linear-gradient(to left, rgba(255, 215, 0, 0.4) 10px, transparent 10px)
            100% 100%,
          linear-gradient(to bottom, rgba(255, 215, 0, 0.4) 10px, transparent 10px)
            0 0,
          linear-gradient(to bottom, rgba(255, 215, 0, 0.4) 10px, transparent 10px)
            100% 0,
          linear-gradient(to top, rgba(255, 215, 0, 0.4) 10px, transparent 10px) 0
            100%,
          linear-gradient(to top, rgba(255, 215, 0, 0.4) 10px, transparent 10px)
            100% 100% !important;
      }

      .mindar-ui-scanning .scanning .inner .scanline {
        background: rgba(255, 215, 0, 0.4) !important;
        box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
      }

      @media (max-width: 768px) {
        a-scene {
          width: 100vw !important;
          height: 100vh !important;
          display: block;
          margin: 0 auto;
        }

        canvas.a-canvas {
          position: fixed !important;
          top: 50% !important;
          left: 50% !important;
          transform: translate(-50%, -50%) !important;
        }
      }
    </style>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/felixmariotto/aframe-gesture-detector@master/dist/aframe-gesture-detector.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/felixmariotto/aframe-gesture-detector@master/dist/aframe-gesture-handler.min.js"></script>
    <script>
      AFRAME.registerComponent("touch-rotate", {
        schema: {
          speed: { default: 0.01 },
        },

        init: function () {
          this.dragging = false;
          this.lastX = 0;
          this.canvas = null;
          this.bindCanvas = this.bindCanvas.bind(this);
          this.unbindCanvas = this.unbindCanvas.bind(this);
          this.onTouchStart = this.onTouchStart.bind(this);
          this.onTouchMove = this.onTouchMove.bind(this);
          this.onTouchEnd = this.onTouchEnd.bind(this);
        },

        play: function () {
          this.el.sceneEl.addEventListener("render-target-loaded", this.bindCanvas);
          this.bindCanvas();
        },

        pause: function () {
          this.el.sceneEl.removeEventListener("render-target-loaded", this.bindCanvas);
          this.unbindCanvas();
        },

        bindCanvas: function () {
          const scene = this.el.sceneEl;
          if (!scene || !scene.canvas) return;
          if (this.canvas === scene.canvas) return;

          this.unbindCanvas();
          this.canvas = scene.canvas;
          this.canvas.style.touchAction = "none";
          this.canvas.addEventListener("touchstart", this.onTouchStart, {
            passive: false,
          });
          this.canvas.addEventListener("touchmove", this.onTouchMove, {
            passive: false,
          });
          this.canvas.addEventListener("touchend", this.onTouchEnd);
          this.canvas.addEventListener("touchcancel", this.onTouchEnd);
        },

        unbindCanvas: function () {
          if (!this.canvas) return;
          this.canvas.removeEventListener("touchstart", this.onTouchStart);
          this.canvas.removeEventListener("touchmove", this.onTouchMove);
          this.canvas.removeEventListener("touchend", this.onTouchEnd);
          this.canvas.removeEventListener("touchcancel", this.onTouchEnd);
          this.canvas = null;
        },

        onTouchStart: function (event) {
          if (event.touches.length !== 1) return;
          this.dragging = true;
          this.lastX = event.touches[0].clientX;
        },

        onTouchMove: function (event) {
          if (!this.dragging || event.touches.length !== 1) return;
          event.preventDefault();

          const currentX = event.touches[0].clientX;
          const deltaX = currentX - this.lastX;
          this.lastX = currentX;

          this.el.object3D.rotation.y += deltaX * this.data.speed;
        },

        onTouchEnd: function () {
          this.dragging = false;
        },
      });
    </script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const scene = document.querySelector("a-scene");
        const targetEntity = document.querySelector('[mindar-image-target="targetIndex: 0"]');
        if (!scene || !targetEntity) return;

        let targetIsFound = false;
        let overlayButton = null;

        const ensureOverlayButton = () => {
          const scanningOverlay = document.querySelector(".mindar-ui-scanning");
          if (!scanningOverlay) return null;

          if (!overlayButton) {
            overlayButton = document.createElement("button");
            overlayButton.id = "arOverlayButton";
            overlayButton.className = "ar-overlay-button";
            overlayButton.setAttribute("aria-hidden", "true");
            overlayButton.textContent = "ARAHKAN KAMERA KE MARKER";
          }

          if (overlayButton.parentElement !== scanningOverlay) {
            scanningOverlay.appendChild(overlayButton);
          }

          return overlayButton;
        };

        const showOverlay = () => {
          if (targetIsFound) return;
          const button = ensureOverlayButton();
          if (!button) return;
          button.classList.remove("is-hidden");
        };

        const hideOverlay = () => {
          const button = ensureOverlayButton();
          if (!button) return;
          button.classList.add("is-hidden");
        };

        const observer = new MutationObserver(() => {
          if (!targetIsFound) showOverlay();
        });

        observer.observe(document.body, {
          childList: true,
          subtree: true,
        });

        showOverlay();

        scene.addEventListener("loaded", showOverlay);
        scene.addEventListener("renderstart", showOverlay);
        scene.addEventListener("arReady", showOverlay);

        targetEntity.addEventListener("targetFound", () => {
          targetIsFound = true;
          hideOverlay();
        });

        targetEntity.addEventListener("targetLost", () => {
          targetIsFound = false;
          showOverlay();
        });
      });
    </script>
  </head>
  <body>
    <a-scene
      mindar-image="
      imageTargetSrc: ./targets_acekid.mind;
      autoStart: true;
      uiScanning: yes; 
      filterMinCF: 0.0001; 
      filterBeta: 0.001; 
      warmupTolerance: 8; 
      missTolerance: 8;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded
      gesture-detector
    >
      <a-assets>
        <a-asset-item id="ususModel" src="./usus.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-entity
          gltf-model="#ususModel"
          position="0 0 0"
          scale="0.2 0.2 0.2"
          touch-rotate="speed: 0.01"
          gesture-handler
        ></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
