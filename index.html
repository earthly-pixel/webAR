<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebAR MindAR + A-Frame Demo</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/felixmariotto/aframe-gesture-detector@master/dist/aframe-gesture-detector.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/felixmariotto/aframe-gesture-detector@master/dist/aframe-gesture-handler.min.js"></script>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@master/examples/image-tracking/assets/card-example/card.mind; autoStart: true; uiScanning: yes;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded
      gesture-detector
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-entity
          geometry="primitive: box"
          material="color: #4CC3D9"
          position="0 0 0"
          scale="0.35 0.35 0.35"
          gesture-handler
        ></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
